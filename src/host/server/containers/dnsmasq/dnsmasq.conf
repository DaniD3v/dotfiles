bind-dynamic
listen-address=10.90.0.8
listen-address=127.0.0.1

server=10.90.0.1 # Upstream DNS

# answer with the uplink address in the client's subnet
interface-name=home.danidev.vip,uplink
localise-queries

domain-needed # doesn't resolve non qalified dns names such as "printer"
bogus-priv # doesn't reverse resolve private ip addresses
